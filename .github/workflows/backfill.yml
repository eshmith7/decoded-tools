name: backfill

# Weekly catalogue crawl. RSS carries no duration, and duration is what
# separates a case study from a news clip - so without this the channel
# baselines every score depends on cannot be computed.
on:
  schedule:
    - cron: "20 2 * * 0"
  workflow_dispatch:
    inputs:
      tier:
        description: "limit to one tier (blank = all)"
        required: false

defaults:
  run:
    working-directory: topic-radar

jobs:
  backfill:
    runs-on: ubuntu-latest
    # The first attempt was killed at exactly 55 minutes, before the
    # writes were batched. Batched it should finish in well under 20,
    # but a first import against an empty database is the slowest this
    # job will ever be, so give it room rather than lose the work.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Crawl catalogues
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python poller/backfill.py \
            ${{ inputs.tier && format('--tier {0}', inputs.tier) || '' }}
