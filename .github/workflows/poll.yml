name: poll

# Every 30 minutes, 01:00-19:30 UTC (06:30-01:00 IST). Deliberately not 24/7:
# on a private repo GitHub's free tier is 2000 minutes a month and every run is
# billed rounded up to a whole minute, so 24/7 at this cadence would be ~1440
# minutes before any other workflow runs. This window is ~1140 and loses
# nothing, because the channels we watch do not publish at 4am IST.
on:
  schedule:
    - cron: "0,30 1-19 * * *"
  workflow_dispatch:

concurrency:
  group: poll
  cancel-in-progress: false

defaults:
  run:
    working-directory: topic-radar

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Poll RSS feeds
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python poller/poll.py --verbose
