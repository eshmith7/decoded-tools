name: shortlist

# Produces the ranked shortlist: renders it on the run's summary page, and
# stores it so the web app has something to show.
#
# Runs daily as well as on demand. That is not the tool deciding anything —
# it still only ranks, and the lead still picks. It is so that opening the
# app shows a current shortlist rather than an empty page, because the app
# cannot run Python and the browser must never be given credentials that
# could. The underlying data moves slowly anyway: the poller runs every few
# hours and the evidence is months of published video.
on:
  schedule:
    - cron: "40 2 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: "how many topics at most (default 8)"
        required: false
      require_trigger:
        description: "only topics with fresh news (not built yet — leave blank)"
        required: false
        type: boolean

defaults:
  run:
    working-directory: topic-radar

jobs:
  shortlist:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      # Cheap, and both production failures so far were the kind these catch.
      - name: Dialect guards
        run: python tests/test_pg_types.py
      - name: Build shortlist
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python poller/score.py --markdown \
            --limit ${{ inputs.limit || 8 }} \
            ${{ inputs.require_trigger && '--require-trigger' || '' }}
      # Same computation, stored rather than printed. The app reads these rows
      # instead of re-deriving the gate in JavaScript, so there is only ever
      # one copy of the rules.
      - name: Store it for the app
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          python poller/publish.py \
            --limit ${{ inputs.limit || 8 }} \
            ${{ inputs.require_trigger && '--require-trigger' || '' }}
