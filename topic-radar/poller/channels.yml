# Channel registry — the demand-evidence panel.
#
# tier 1  direct benchmark: same format, same audience. Their performance is
#         the strongest signal we have about whether a topic works.
# tier 2  adjacent: finance and personal-finance channels whose topics overlap
#         ours partially.
# tier 3  wide net: news outlets and global explainers. Weak topic evidence,
#         but they surface stories early and set what "already covered" means.
#
# lang matters more than it looks. Measured correlation between a topic's Hindi
# and English performance is only r=0.23, so a topic exploding in Hindi is weak
# evidence it will work in English. Scoring keeps the two apart and weights
# English higher, because Decoded publishes in English.
#
# Every id below was verified against a subscriber floor. Handle resolution
# alone is not safe: @DrVivekBindra, @CARahulMalodia and @sandeepmaheshwari all
# resolve to squatter accounts with double-digit subscriber counts.
#
# poll_minutes is per channel because RSS only returns the last 15 uploads;
# a channel posting more often than we poll loses items before we see them.

