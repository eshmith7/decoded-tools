# Canonical topic registry.
#
# Granularity is entity-level by decision: "BlackRock" is one topic, and
# "BlackRock owns everything" and "BlackRock and ESG" are framings of it, not
# separate topics. Framings live on video_topics, not here.
#
# This file is the fast path, not the whole story. Lexical extraction cannot
# build it — tried twice. Ranking title tokens by frequency surfaces creator
# names (dhruv, rathee, abhi, niyu) and hype words (reality, exposed, dark)
# far above real entities, and matching bare capitalised words invents topics
# like "north", "pros" and "ever". So entries here are curated, and
# `classify_llm.py` handles whatever the dictionary misses, appending what it
# learns back into this file.
#
# aliases are matched case-insensitively on word boundaries against the title.
# Keep them specific: a one-word alias that is also an ordinary English word
# will match everywhere and quietly poison that topic's demand figures.

